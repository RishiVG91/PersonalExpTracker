server.port=${PORT:8080}

# JWT
app.jwt.secret=${APP_JWT_SECRET:Y2hvb29zZS1hLXNlY3VyZS1hbmQtc3Ryb25nLWtleS1mb3Itand0LXNpZ25pbmctMjU2LWJpdHM=}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Database Configuration (defaults to H2 for local dev if DB_URL is not set)
spring.datasource.url=${DB_URL:jdbc:h2:mem:expansedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true