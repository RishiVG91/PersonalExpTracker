server.port=${PORT:8080}

app.jwt.secret=${APP_JWT_SECRET:Y2hvb29zZS1hLXNlY3VyZS1hbmQtc3Ryb25nLWtleS1mb3Itand0LXNpZ25pbmctMjU2LWJpdHM=}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Database Configuration
# Defaults to in-memory H2 database for local development so it runs without any setup.
# In production (e.g., Render), supply DB_URL, DB_USERNAME, DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:h2:mem:expansedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true